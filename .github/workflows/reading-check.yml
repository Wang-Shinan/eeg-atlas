name: Chapter three reading checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-atlas.txt
      - run: python scripts/export-reading-sample.py
      - name: Package inspectable source and calibrated sample
        run: |
          mkdir -p test-artifacts
          git archive HEAD --format=tar.gz > test-artifacts/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: reading-review
          path: |
            test-artifacts/
            public/reading/
          retention-days: 14
