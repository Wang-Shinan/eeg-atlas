name: Deploy to GitHub Pages

# This file is written for a repository whose root is the `site/` directory.
# See DEPLOYING.md before enabling it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued deploy replace an older one, but never cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://wang-shinan.github.io
      SITE_BASE: /eeg-atlas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-atlas.txt
      - name: Install atlas build dependencies
        run: python -m pip install -r scripts/requirements-atlas.txt

      - run: npm ci

      - name: Type check
        run: npm run check

      # No local chapter-vault import. Atlas geometry is reproducibly exported
      # from pinned packages; the published site remains fully static.
      - name: Build
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
