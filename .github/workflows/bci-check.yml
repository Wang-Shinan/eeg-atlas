name: BCI curriculum review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-atlas.txt playwright==1.55.0
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
      - run: node scripts/test-bci.mjs
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build-bci-preview.py
      - run: python scripts/test-bci-browser.py
      - name: Package inspectable source
        if: always()
        run: |
          mkdir -p test-artifacts
          git archive HEAD --format=tar.gz > test-artifacts/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bci-review
          path: |
            test-artifacts/
            dist-pages/
          retention-days: 14
