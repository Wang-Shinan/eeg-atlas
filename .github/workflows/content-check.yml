name: Content and electrode atlas checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-atlas.txt
      - run: python -m pip install -r scripts/requirements-atlas.txt playwright==1.55.0
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
      - run: python scripts/export-electrode-atlas.py --check
      - run: npm run build
      - run: npm run test:editor
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test-atlas-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-review
          path: |
            test-artifacts/
            dist-pages/
          if-no-files-found: warn
          retention-days: 14
